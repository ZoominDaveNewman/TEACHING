<script>
/* ==================== ENGINE ==================== */
/* Month index 0 is the tutorial month; months 1-4 are scored; the rolling horizon runs 12 months from the current month. */
const N = 18;
const C = {BASECAP:900, OTMAX:135, CREW:80, CREWMAX:3, CREWCOST:70000, OTPREM:250, OUTMAX:120, OUTCOST:4400,
  PRICE:{L:5500, M:1900}, SCRAPPER:1.1, SCRAPCOST:400, ALLOY:{L:0.12, M:0.08}, ALLOYCOST:3500,
  BACKUPPREM:1100, SPOTPREM:2500, SPOTMAX:30, CONV:{L:1600, M:500}, FIXED:420000, CARRY:0.015, WIP:1500000};
C.STD = {L: C.SCRAPPER*C.SCRAPCOST + C.ALLOY.L*C.ALLOYCOST + C.CONV.L, M: C.SCRAPPER*C.SCRAPCOST + C.ALLOY.M*C.ALLOYCOST + C.CONV.M};
const SEAS_L = [1.00,0.95,0.97,1.03,1.05,1.04,1.00,0.96,0.95,1.00,1.03,1.02];
const SEAS_M = [0.98,1.00,1.00,1.02,1.03,1.02,1.00,0.98,0.98,1.00,1.01,1.00];
const BASE = {L:[], M:[]};
for (let i=0;i<N;i++){ BASE.L[i]=Math.round(520*SEAS_L[i%12]); BASE.M[i]=Math.round(330*SEAS_M[i%12]); }
const BUD = [];
for (let i=0;i<N;i++){ const dL=BASE.L[i]*1.04, dM=BASE.M[i]*1.04; const rev=dL*C.PRICE.L+dM*C.PRICE.M;
  const cogs=dL*C.STD.L+dM*C.STD.M+C.FIXED+30000; BUD[i]={demL:dL, demM:dM, rev, cogs, margin:rev-cogs}; }
/* The one fixed scenario every student plays */
const SCN = {announced:180, aprFrac:0.60, maySlip:0.25, kestrelFrac:0.20, opsLoss:0.30, opsDays:9};
const SIG = {ops:0.20, opsDays:6, kestrel:0.50, tut:0.23};
const NOISE = (function(){ let a=20261101; const r=()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const n={L:[],M:[]}; for (let i=0;i<N;i++){ n.L[i]=(r()*2-1)*0.05; n.M[i]=(r()*2-1)*0.05; } return n; })();
const need = (L,M,k) => k==='scrap' ? C.SCRAPPER*(L+M) : C.ALLOY.L*L + C.ALLOY.M*M;
/* Tutorial month and the fixed Month 1 starting position */
const INIT = {fgL:120, fgM:80, scrap:450, alloy:25};
const TUT = {fcL:BASE.L[0], fcM:BASE.M[0], chgL:-120, chgM:-30, actL:532, actM:316};
const TUTPROD = {L:TUT.fcL+TUT.chgL, M:TUT.fcM+TUT.chgM};
const PRE = {scrap0:760, alloy0:70, alloy1:Math.round(need(BASE.L[1],BASE.M[1],'alloy'))};
const TUT_START = {fgL:INIT.fgL-TUTPROD.L+TUT.actL, fgM:INIT.fgM-TUTPROD.M+TUT.actM,
  scrap:INIT.scrap+need(TUTPROD.L,TUTPROD.M,'scrap')-PRE.scrap0, alloy:INIT.alloy+need(TUTPROD.L,TUTPROD.M,'alloy')-PRE.alloy0};

function actualDemand(i){
  if (i===0) return {L:TUT.actL, M:TUT.actM};
  let L=Math.round(BASE.L[i]*(1+NOISE.L[i])), M=Math.round(BASE.M[i]*(1+NOISE.M[i]));
  if (i===4) L+=Math.round(SCN.announced*SCN.aprFrac);
  if (i===5) L+=Math.round(SCN.announced*SCN.maySlip);
  return {L,M};
}
function defaultPlan(){
  const P={fcL:[],fcM:[],chgL:[],chgM:[],outL:[],ot:[],crews:[],scrap:[],alloy:[],backup:[],spot:[],priority:'L'};
  for (let i=0;i<N;i++){ P.fcL[i]=BASE.L[i]; P.fcM[i]=BASE.M[i]; P.chgL[i]=0; P.chgM[i]=0; P.outL[i]=0; P.ot[i]=0; P.crews[i]=0; P.backup[i]=0; P.spot[i]=0;
    P.scrap[i]= i+1<N ? Math.round(need(BASE.L[i+1],BASE.M[i+1],'scrap')) : 0;
    P.alloy[i]= i+2<N ? Math.round(need(BASE.L[i+2],BASE.M[i+2],'alloy')) : 0; }
  P.chgL[0]=TUT.chgL; P.chgM[0]=TUT.chgM;
  return P;
}
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,+v||0));
const reqProd=(P,i,f)=>Math.max(0,(+P['fc'+f][i]||0)+(+P['chg'+f][i]||0)-(f==='L'?(+P.outL[i]||0):0));
function scrapIn(P,i){ return (i===0?PRE.scrap0:0)+(i>=1?(+P.scrap[i-1]||0):0); }
function kestrelBase(P,i){ return (i===0?PRE.alloy0:0)+(i===1?PRE.alloy1:0)+(i>=2?(+P.alloy[i-2]||0):0); }
function kestrelIn(P,i,frac){ if(frac==null) return kestrelBase(P,i);
  if(i===4) return kestrelBase(P,4)*frac; if(i===5) return kestrelBase(P,5)+kestrelBase(P,4)*(1-frac); return kestrelBase(P,i); }
function backupIn(P,i){ return i>=1?(+P.backup[i-1]||0):0; }
function inputsFor(P,i,disrupt,frac){
  const spot=clamp(P.spot[i],0,C.SPOTMAX), bk=backupIn(P,i), ke=kestrelIn(P,i,frac);
  return {prodL:reqProd(P,i,'L'), prodM:reqProd(P,i,'M'), ot:clamp(P.ot[i],0,C.OTMAX), crews:clamp(P.crews[i],0,C.CREWMAX),
    outL:clamp(P.outL[i],0,C.OUTMAX), disrupt, scrapIn:scrapIn(P,i), kestrel:ke, backup:bk, spot,
    alloyIn:ke+bk+spot, alloyPrem:bk*C.BACKUPPREM+spot*C.SPOTPREM, priority:P.priority};
}
function monthCalc(s,inp,dem){
  const A=C.ALLOY, SP=C.SCRAPPER;
  const regCap=Math.max(0,C.BASECAP*(1-inp.disrupt)), crewCap=C.CREW*inp.crews, cap=regCap+crewCap+inp.ot;
  const scrapAv=s.scrap+inp.scrapIn, alloyAv=s.alloy+inp.alloyIn;
  const pL=Math.max(0,inp.prodL), pM=Math.max(0,inp.prodM);
  const lim=(p,c,sc,al,a)=>Math.max(0,Math.min(p,c,sc/SP,al/a));
  let L,M;
  if (inp.priority==='L'){ L=lim(pL,cap,scrapAv,alloyAv,A.L); M=lim(pM,cap-L,scrapAv-SP*L,alloyAv-A.L*L,A.M); }
  else if (inp.priority==='M'){ M=lim(pM,cap,scrapAv,alloyAv,A.M); L=lim(pL,cap-M,scrapAv-SP*M,alloyAv-A.M*M,A.L); }
  else { const T=pL+pM; let k=1; const an=A.L*pL+A.M*pM;
    if (T>0) k=Math.min(1,cap/T,scrapAv/(SP*T),an>0?alloyAv/an:1); k=Math.max(0,k); L=pL*k; M=pM*k; }
  const used=L+M, short=(pL+pM)-used;
  let reason='';
  if (short>0.5){ if (used>=cap-0.5) reason='capacity'; else if (scrapAv-SP*used<1) reason='steel scrap'; else reason='ferrochrome'; }
  const otUsed=Math.max(0,Math.min(inp.ot,used-regCap-crewCap)), outL=inp.outL;
  const avL=s.fgL+L+outL, avM=s.fgM+M, shipL=Math.min(avL,dem.L), shipM=Math.min(avM,dem.M);
  const end={fgL:Math.max(0,avL-shipL), fgM:Math.max(0,avM-shipM), scrap:Math.max(0,scrapAv-SP*used), alloy:Math.max(0,alloyAv-A.L*L-A.M*M)};

function projDisrupt(r,i){ if(r===0&&i===0) return SIG.tut; if(r===3&&i===3) return SIG.ops; return 0; }
function project(st){
  const P=st.plan, r=st.r, rows=[]; let s={...st.inv};
  const frac = r>=2 ? SIG.kestrel : null;
  for (let i=r;i<Math.min(r+12,N);i++){
    const res=monthCalc(s,inputsFor(P,i,projDisrupt(r,i),frac),{L:+P.fcL[i]||0,M:+P.fcM[i]||0});
    res.i=i; rows.push(res); s=res.end;

}

function kpiOf(row,i,fc,plan){
  const pt=plan.L+plan.M;

    turns:row.cogs*12/Math.max(1,(row.invBegin+row.invEnd)/2),

    acc:1-(Math.abs(fc.L-row.demL)/Math.max(1,row.demL)+Math.abs(fc.M-row.demM)/Math.max(1,row.demM))/2,

}
function kpiCum(hist){

function projKpis(rows){
  let ship=0,dem=0,cogs=0,inv=0,m=0,bm=0;
  rows.forEach(a=>{ ship+=a.shipL+a.shipM; dem+=a.demL+a.demM; cogs+=a.cogs; inv+=(a.invBegin+a.invEnd)/2; m+=a.margin; bm+=BUD[a.i].margin; });

/* MRP-style netting: suggest scrap and Kestrel orders from the required production plan */
function suggestOrders(st,kinds){
  const P=st.plan, r=st.r, end=Math.min(r+5,N-1);
  [['scrap',1,0.25],['alloy',2,0.5]].filter(([k])=>!kinds||kinds.includes(k)).forEach(([k,lead,ssm])=>{
    for (let i=Math.max(r,1);i<=end;i++){
      const t=i+lead; if (t>=N) continue;
      P[k][i]=0;
      const rows=project(st), rowPrev=rows.find(x=>x.i===t-1), rowT=rows.find(x=>x.i===t);
      if (!rowT) continue;
      const begin = rowPrev ? rowPrev.end[k] : st.inv[k];
      const other = k==='scrap' ? rowT.scrapIn : rowT.alloyIn;
      const nT=need(reqProd(P,t,'L'),reqProd(P,t,'M'),k), nn=t+1<N?need(reqProd(P,t+1,'L'),reqProd(P,t+1,'M'),k):nT;
      const f = (k==='alloy' && t===4 && r>=2) ? SIG.kestrel : 1;
      P[k][i]=Math.max(0,Math.round((nT+ssm*nn-begin-other)/f));
    }
  });
}

  if (i===3) out.push({cat:'Operations',ctl:UNC,txt:`The furnace repair took ${SCN.opsDays} days instead of ${SIG.opsDays}, so regular capacity fell by ${pc(SCN.opsLoss)} (to ${t0(C.BASECAP*(1-SCN.opsLoss))} t) instead of 20%.`});
  if (i===4){ out.push({cat:'Demand',ctl:UNC,txt:`Bonanza Ridge ordered ${t0(SCN.announced*SCN.aprFrac)} t of liners, ${pc(SCN.aprFrac)} of its ${SCN.announced} t estimate. About ${t0(SCN.announced*SCN.maySlip)} t moved to ${mname(5)} and the rest was cancelled.`});
    out.push({cat:'Supply',ctl:UNC,txt:`Kestrel Ferroalloys, the overseas supplier, delivered only ${pc(SCN.kestrelFrac)} of this month's ferrochrome order instead of the 50% signaled. The balance arrives in ${mname(5)}.`}); }
  if (a.short>0.5) out.push({cat:a.reason==='capacity'?'Operations':'Supply', ctl:((i===3&&a.reason==='capacity')||(i===4&&a.reason==='ferrochrome'))?UNC:CTL, txt:`Production fell ${t0(a.short)} t short of the plan, limited by ${a.reason}.`});
  if (a.lostL+a.lostM>0.5) out.push({cat:'Demand',ctl:CTL,txt:`${t0(a.lostL+a.lostM)} t of demand (${t0(a.lostL)} t liners, ${t0(a.lostM)} t grinding media) could not be shipped and was lost to competitors.`});
  return out;
}

const $=id=>document.getElementById(id);
function renderRounds(){

    const done = g && g.mode==='real' && (i<cur);

    return `<li class="${done?'done':''} ${now?'now':''}"${now?' aria-current="step"':''}>${l}${done?' <span class="sr-only">(complete)</span>':''}</li>`; }).join('');

function render(focus){
  renderRounds();

  else {
    const nav = isTut() ? '' : stepNav();

    app.innerHTML = nav + (isTut()?`<div id="guide-slot"></div>`:'') + body + (isTut()?'':savePanel());

}

/* ---------- Charts ---------- */
function rccpSVG(rows){
  const W=640,H=230,ml=46,mr=12,mt=14,mb=34, n=rows.length, iw=W-ml-mr, ih=H-mt-mb;
  const top=Math.max(...rows.map(r=>Math.max(r.pL+r.pM,r.cap)))*1.12||1;
  const y=v=>mt+ih-(v/top)*ih, bw=iw/n*0.56;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rough-cut capacity chart: required in-house load against regular and available capacity by month. The Rough-Cut Production Plan table has the same values.">`;
  for (let k=0;k<=4;k++){ const v=Math.round(top*k/4/50)*50; s+=`<line class="grid" x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml-6}" y="${y(v)+4}" text-anchor="end">${t0(v)}</text>`; }
  let reg='',mx='';
  rows.forEach((r,k)=>{ const cx=ml+iw/n*(k+0.5), load=r.pL+r.pM; const cls=load>r.cap+0.5?'over':(load>r.regCap+r.crewCap+0.5?'ot':'');
    s+=`<rect class="bar ${cls}" x="${cx-bw/2}" y="${y(load)}" width="${bw}" height="${Math.max(0,y(0)-y(load))}"/>`;
    s+=`<text x="${cx}" y="${y(load)-5}" text-anchor="middle">${t0(load)}</text><text x="${cx}" y="${H-12}" text-anchor="middle">M${r.i} ${MON[calOf(r.i).m]}</text>`;
    const x0=ml+iw/n*k+4, x1=ml+iw/n*(k+1)-4; reg+=`M${x0},${y(r.regCap+r.crewCap)}H${x1}`; mx+=`M${x0},${y(r.cap)}H${x1}`; });
  s+=`<path class="capline" d="${reg}"/><path class="maxline" d="${mx}"/></svg>`;
  return s+`<div class="legend"><span><span class="sw" style="background:var(--bar)"></span>Load within regular capacity and crews</span><span><span class="sw" style="background:var(--bar-ot)"></span>Load needs overtime</span><span><span class="sw" style="background:var(--bar-over)"></span>Load over available capacity</span><span><span class="sw" style="border-top:2px dashed var(--ink);height:0"></span>Regular + crews</span><span><span class="sw" style="border-top:2px solid var(--bad);height:0"></span>Available capacity with overtime</span></div>`;
}
function finSVG(rows){
  const W=640,H=240,ml=56,mr=12,mt=14,mb=30,n=rows.length,iw=W-ml-mr,ih=H-mt-mb;
  const vals=rows.flatMap(r=>[r.margin,BUD[r.i].margin]); const top=Math.max(...vals)*1.15, bot=Math.min(0,...vals);
  const y=v=>mt+ih-((v-bot)/(top-bot))*ih, bw=iw/n*0.55;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected monthly gross margin bars against the budget margin line for the 12-month horizon. The table below has the same values.">`;
  for (let k=0;k<=4;k++){ const v=bot+(top-bot)*k/4; s+=`<line class="grid" x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml-6}" y="${y(v)+4}" text-anchor="end">${kd(v)}</text>`; }
  let path='';
  rows.forEach((r,k)=>{ const cx=ml+iw/n*(k+0.5); const v=r.margin;
    s+=`<rect class="bar" x="${cx-bw/2}" y="${Math.min(y(v),y(0))}" width="${bw}" height="${Math.abs(y(0)-y(v))}"/><text x="${cx}" y="${H-10}" text-anchor="middle">M${r.i}</text>`;
    path+=(k?'L':'M')+cx+','+y(BUD[r.i].margin); });
  s+=`<path class="budget" d="${path}"/>${rows.map((r,k)=>`<circle class="budgetdot" cx="${ml+iw/n*(k+0.5)}" cy="${y(BUD[r.i].margin)}" r="3.5"/>`).join('')}</svg>`;
  return s+`<div class="legend"><span><span class="sw" style="background:var(--bar)"></span>Projected gross margin</span><span><span class="sw" style="background:var(--budget);height:3px"></span>Budget gross margin</span></div>`;
}

      <details><summary>Where the premiums in COGS come from (next six months)</summary>
        <div class="tablewrap"><table><thead><tr><th scope="col" style="text-align:left">Month</th>${rows.slice(0,6).map(r=>`<th scope="col">${mhead(r.i)}</th>`).join('')}</tr></thead><tbody>
        ${[['Overtime','ot'],['Temporary crews','crew'],['Outsourcing','out'],['Ferrochrome premiums','alloy'],['Inventory carrying','carry']].map(([n,k])=>`<tr><th scope="row">${n}</th>${rows.slice(0,6).map(r=>`<td>${kd(r.prem[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`);
    if (!isTut()){ const c=checks(); setT('c-check', c.map(([okk,t])=>`<li>${okk?ok('✓ Done:'):red('✗ To do:')} ${t}</li>`).join(''));
      const b=$('b-lock'); if(b) b.disabled=!c.every(x=>x[0]); }
  }
}

/* ---------- Final view and report ---------- */
function finalView(){
  return `<h2>Final results: ${mlong(4)}</h2>
  <p class="lede noprint">The simulation is complete. Reconcile Month 4, write your final reflection, then save your report as a PDF and submit it as your instructor directs.</p>
  <div class="noprint">
  <div class="callout"><p class="from">What happened in ${mlong(4)}</p>${occurrenceText(4).map(x=>`<p>${esc(x)}</p>`).join('')}</div>
  ${expActTable(4)}
  <h3>Assumptions and Occurrences log</h3>
  ${aoTable()}
  ${aoBlock('Occurrence','Demand')}
  ${reconBlock(4)}
  <h3>Final reflection</h3>
  <label for="t-final">What did the SIOP process help you see in time, and what did it not?</label>
  <p class="hint" id="t-final-h">Discuss which signals you acted on and which levers you pulled, how your assumptions held up, the trade-offs between service, inventory, and margin, and what you would do differently. At least 150 characters.</p>
  <textarea id="t-final" data-t="final" aria-describedby="t-final-h" style="min-height:160px">${esc(g.final||'')}</textarea>
  <p class="small" id="c-final-n"></p>
  <h3>Submit your report</h3>
  <div class="panel">
    <p>Select <strong>Save report as PDF</strong>, choose “Save as PDF” as the printer, and submit the PDF as your instructor directs. The report below is exactly what will be saved.</p>
    <ul class="check" id="c-subcheck"></ul>
    <div class="row">
      <button class="btn" type="button" data-act="print" id="b-print">Save report as PDF</button>
      <button class="btn secondary" type="button" data-act="copyreport">Copy report</button>
      <span id="exp-msg" role="status"></span>
    </div>
    <p class="small" id="exp-note">If saving a PDF does not work on your device, select Copy report and paste it into your course’s text submission box. The tables are kept.</p>
  </div>
  </div>
  <section class="report" id="report" aria-label="Simulation report"></section>
  <div class="row noprint"><button class="btn secondary" type="button" data-act="restart">Start a new simulation</button></div>
  <div id="restart-confirm" class="noprint"></div>`;
}
function refreshFinal(){
  const n=(g.recon[4]||'').trim().length, f=(g.final||'').trim().length;
  setT('c-recon-n', n>=60?ok('Length requirement met.'):`${n} of 60 characters.`);
  setT('c-final-n', f>=150?ok('Length requirement met.'):`${f} of 150 characters.`);
  setT('c-subcheck', [[n>=60,'Month 4 reconciliation written'],[f>=150,'Final reflection written']].map(([okk,t])=>`<li>${okk?ok('✓ Done:'):amb('Not yet:')} ${t}</li>`).join(''));
  setT('report', reportTables());
  if (/claude/.test(location.hostname)){ const b=$('b-print'); if(b) b.hidden=true; setT('exp-note','Saving as PDF is turned off in this preview. When the simulation runs from GitHub Pages, the Save report as PDF button appears here. You can still copy the report.'); }
}
function reportTables(){
  const cum=kpiCum(g.hist), pts=scorePts(cum), M=[1,2,3,4];
  const tbl=(cap,head,rows)=>`<div class="tablewrap"><table><caption>${cap}</caption><thead><tr>${head.map((h,k)=>`<th scope="col"${k===0?' style="text-align:left"':''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  const tr=(h,cells,cls)=>`<tr${cls?` class="${cls}"`:''}><th scope="row">${h}</th>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
  let s=`<h2 style="margin-top:28px">SIOP Simulation Report</h2>
  <div class="rhead"><div><span>Student</span>${esc(g.name)}</div><div><span>Simulation</span>Wasatch Foundry Works SIOP Simulation</div>
  <div><span>Months simulated</span>${mname(1)} to ${mname(4)}</div><div><span>Report date</span>${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</div>
  <div><span>Verification code</span>${verifCode(g.name,cum)}</div><div><span>Scorecard points</span><strong>${pts} of 25</strong></div>
  <div><span>Instructor-graded written work</span>____ of 25</div><div><span>Total</span>____ of 50</div></div>`;
  const tail=`<p class="small" style="margin-top:24px">Wasatch Foundry Works SIOP Simulation © 2026 David Newman. All rights reserved.</p>`;
  s+=`<h3>1. Balanced scorecard</h3>`+tbl('KPIs by month and cumulative',['KPI',...M.map(mhead),'Cumulative','Status','Points'],
    KDEF.map(d=>tr(d.name,[...M.map(i=>d.f(g.hist[i].k[d.k])),`<strong>${d.f(cum[d.k])}</strong>`,STL[st(d,cum[d.k])],PTS[st(d,cum[d.k])]])).concat([tr('Total scorecard points',['','','','','','',`<strong>${pts}</strong>`],'total')]));
  s+=`<h3>2. Plan vs actual by month</h3><div class="grid2">${M.map(i=>expActTable(i)).join('')}</div>`;
  s+=`<h3>3. Financial summary</h3>`+tbl('Monthly actual results vs budget',['Month','Revenue','COGS','Gross margin','Margin %','Budget margin','Variance'],
    M.map(i=>{const a=g.hist[i].act; return tr(mlong(i),[kd(a.rev),kd(a.cogs),kd(a.margin),(a.margin/a.rev*100).toFixed(1)+'%',kd(BUD[i].margin),kd(a.margin-BUD[i].margin)]);})
    .concat([(()=>{const R=M.reduce((x,i)=>x+g.hist[i].act.rev,0),Co=M.reduce((x,i)=>x+g.hist[i].act.cogs,0),B=M.reduce((x,i)=>x+BUD[i].margin,0);return tr('Total',[kd(R),kd(Co),kd(R-Co),((R-Co)/R*100).toFixed(1)+'%',kd(B),kd(R-Co-B)],'total');})()]));
  s+=`<h3>4. 12-month rolling forecast at each lock</h3>`+tbl('What you committed to at each Executive Review',['Plan locked in','12-mo revenue','12-mo COGS','12-mo gross margin','Budget margin (same 12 months)','Gap to budget'],
    M.map(i=>{const p=g.hist[i].proj12; const R=p.reduce((x,q)=>x+q.rev,0),Co=p.reduce((x,q)=>x+q.cogs,0),B=p.reduce((x,q)=>x+BUD[q.i].margin,0); return tr(mlong(i),[kd(R),kd(Co),kd(R-Co),kd(B),kd(R-Co-B)]);}));
  s+=`<h3>5. Levers pulled</h3>`+tbl('Lever settings in each locked plan and the premium cost incurred',['Month','Inv. change liners','Inv. change media','Outsourced (t)','Overtime used (t)','Temp crews','Domestic FeCr arriving (t)','Broker spot FeCr (t)','Premium cost'],
    M.map(i=>{const h=g.hist[i], a=h.act, p=a.prem; return tr(mlong(i),[sgn(h.chg.L),sgn(h.chg.M),t0(a.outL),t0(a.otUsed),h.lev.crews,t0(a.backup),t0(a.spot),kd(p.ot+p.crew+p.out+p.alloy)]);}));
  s+=`<h3>6. Assumptions and Occurrences log</h3>`+(g.ao.length?tbl(`${g.ao.length} entries`,['Logged in','Kind','Area','Type','Month affected','Entry'],
    aoSorted().map(a=>`<tr><th scope="row">Month ${a.r}</th><td style="text-align:left">${a.kind}${a.sim?' (simulation)':''}</td><td style="text-align:left">${a.cat}</td><td style="text-align:left">${a.ctl.split(' ')[0]}</td><td style="text-align:left">Month ${a.m}</td><td style="text-align:left;white-space:normal;min-width:260px">${esc(a.txt)}</td></tr>`)):'<p>No entries.</p>');
  s+=`<h3>7. Written work</h3>`+M.map(i=>`<h4>${mlong(i)}</h4><p class="small">Gap-closing actions</p><div class="prose">${esc(g.hist[i].gap||'(none)')}</div><p class="small">Reconciliation of expected vs actual</p><div class="prose">${esc(g.recon[i]||'(none)')}</div>`).join('')
    +`<h4>Final reflection</h4><div class="prose">${esc(g.final||'(none)')}</div>`;
  return s+tail;
}
function reportForPaste(){
  return reportTables().replace(/<table>/g,'<table border="1" cellpadding="4" style="border-collapse:collapse">').replace(/<div class="prose">/g,'<div style="white-space:pre-wrap">');
}
function savePanel(){
  return `<details class="panel noprint" style="margin-top:32px"><summary>Save code (continue on another computer)</summary>
  <p class="hint">Your work saves automatically in this browser. To move to another computer, create a save code, copy it, and paste it on the start screen there.</p>
  <div class="row"><button class="btn small secondary" type="button" data-act="savecode">Create save code</button></div>
  <label for="savecode-out" class="sr-only">Save code</label><textarea id="savecode-out" readonly style="min-height:70px"></textarea></details>`;
}

/* ==================== EVENTS ==================== */
function lockMonth(){
  const r=g.r, rows=project(g), exp=rows[0], act=executeMonth(g);
  const fc={L:+g.plan.fcL[r]||0,M:+g.plan.fcM[r]||0}, plan={L:exp.pL,M:exp.pM};
  const slim=x=>({L:x.L,M:x.M,short:x.short,reason:x.reason,demL:x.demL,demM:x.demM,shipL:x.shipL,shipM:x.shipM,lostL:x.lostL,lostM:x.lostM,
    rev:x.rev,cogs:x.cogs,margin:x.margin,invBegin:x.invBegin,invEnd:x.invEnd,begin:x.begin,end:x.end,outL:x.outL,otUsed:x.otUsed,backup:x.backup,spot:x.spot,prem:x.prem});
  g.hist[r]={fc,plan,chg:{L:+g.plan.chgL[r]||0,M:+g.plan.chgM[r]||0},lev:{outL:+g.plan.outL[r]||0,ot:+g.plan.ot[r]||0,crews:+g.plan.crews[r]||0},
    exp:slim(exp),act:slim(act),k:kpiOf(act,r,fc,plan),proj12:rows.map(p=>({i:p.i,rev:p.rev,cogs:p.cogs,margin:p.margin})),gap:g.gap[r]||''};
  occurrenceItems(r).forEach(o=>g.ao.push({id:g.aoSeq++, r:r+1, kind:'Occurrence', cat:o.cat, ctl:o.ctl, m:r, txt:o.txt, sim:true}));
  g.inv=act.end; g.r=r+1; clearHist(); resetOpen=false;
}
document.addEventListener('input',e=>{
  const el=e.target; if(!g) return;
  if (el.dataset.f && el.dataset.f!=='priority'){ const mx=el.max!==''?+el.max:Infinity, mn=el.min!==''?+el.min:-Infinity; g.plan[el.dataset.f][+el.dataset.i]=clamp(el.value,mn,mx); saveSoon(); refresh(); }
  if (el.dataset.t==='recon'){ g.recon[+el.dataset.i]=el.value; saveSoon(); refresh(); }
  if (el.dataset.t==='gap'){ g.gap[+el.dataset.i]=el.value; saveSoon(); refresh(); }
  if (el.dataset.t==='final'){ g.final=el.value; saveSoon(); refresh(); }
});
document.addEventListener('focusin',e=>{ const el=e.target; if(g && el.dataset && el.dataset.f && el.dataset.f!=='priority') pendingSnap={key:el.id, plan:JSON.stringify(g.plan), val:el.value}; });
document.addEventListener('change',e=>{ const el=e.target; if(!g) return;
  if (el.dataset.f==='priority'){ pushUndo('Production priority'); g.plan.priority=el.value; saveSoon(); refresh(); updateUndoBar(); return; }
  if (el.dataset.f && pendingSnap && pendingSnap.key===el.id && el.value!==pendingSnap.val){
    pushUndo(`${FNAME[el.dataset.f]||'Plan cell'}, M${el.dataset.i}`, pendingSnap.plan); pendingSnap={key:el.id, plan:JSON.stringify(g.plan), val:el.value}; save(); updateUndoBar(); } });
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act;
  const nameIn=$('s-name'); if(nameIn) pendingName=nameIn.value.trim();
  if (act==='starttut'){ g=tutGame(pendingName); DATES=g.dates; render(); focusGuide(); }
  if (act==='start'){ if(!pendingName){ $('s-err').textContent='Enter your name to start Month 1.'; $('s-name').focus(); return; }
    g=newGame(pendingName); DATES=g.dates; save(); render(true); announce('Simulation started. Month 1 briefing.'); }
  if (act==='resume'){ g=load(); DATES=g.dates; ensureHist(); render(true); }
  if (act==='import'){ try{ const o=JSON.parse(decodeURIComponent(escape(atob($('s-import').value.trim())))); if(!o.plan||o.v!==2) throw 0; g=o; DATES=g.dates; ensureHist(); save(); render(true); }catch(x){ $('s-ierr').textContent='That save code could not be read. Copy the whole code and try again.'; } }
  if (act==='tutnext') tutGo(g.step+1);
  if (act==='tutback') tutGo(g.step-1);
  if (act==='tutrun'){ g.plan=defaultPlan(); lockMonth(); g.ran=true; g.step++; g.view='report'; render(); focusGuide(); announce('Month 0 complete. Month-end report ready.'); }
  if (act==='tutreplay'){ g=tutGame(g.name); render(); focusGuide(); }
  if (act==='tutexit'||act==='tutdone'){ const nm=g.name; g=null; pendingName=nm;
    if (act==='tutdone' && nm){ g=newGame(nm); DATES=g.dates; save(); render(true); announce('Month 1 started.'); }
    else { render(true); if(act==='tutdone'){ setT('s-err','Enter your name, then select Skip to Month 1 to begin.'); } } }
  if (act==='go'){ g.view=b.dataset.v; confirmOpen=false; save(); render(true); }
  if (act==='copyfc'){ const f=b.dataset.f; pushUndo(`${f==='L'?'Liner':'Grinding media'} forecast: ${({base:'statistical baseline',vp:'Sales VP proposal',bud:'annual budget volume'})[b.dataset.src]}`); win().forEach(i=>g.plan['fc'+f][i]= b.dataset.src==='base'?BASE[f][i]:b.dataset.src==='bud'?Math.round(BUD[i]['dem'+f]):vp(f,i)); save(); render(); announce('Forecast updated.'); }
  if (act==='chase'){ pushUndo('Chase demand'); win().forEach(i=>{ g.plan.chgL[i]=0; g.plan.chgM[i]=0; }); save(); render(); announce('Chase plan: inventory change set to zero, production equals demand.'); }
  if (act==='level'){ pushUndo('Level production'); const W=win(); ['L','M'].forEach(f=>{ const tot=W.reduce((s,i)=>s+(+g.plan['fc'+f][i]||0)-(f==='L'?(+g.plan.outL[i]||0):0),0), lv=Math.round(tot/W.length);
      W.forEach(i=>{ g.plan['chg'+f][i]=lv-(+g.plan['fc'+f][i]||0)+(f==='L'?(+g.plan.outL[i]||0):0); }); });
    save(); render(); announce('Level plan: inventory changes set so production runs at a steady rate.'); }
  if (act==='mrp'){ pushUndo('MRP auto replenishment'); suggestOrders(g,['scrap']); save(); render(); announce('Steel scrap orders set by MRP auto replenishment. Review them before locking.'); }
  if (act==='addao'){ const id=b.dataset.ao, box=document.querySelector(`.aoform[data-ao="${id}"]`), txt=$(id+'-txt').value.trim();
    if(!txt){ $(id+'-txt').focus(); announce('Write the entry before adding it.'); return; }
    g.ao.push({id:g.aoSeq++, r:g.r, kind:box.dataset.kind, cat:$(id+'-cat').value, ctl:$(id+'-ctl').value, m:+$(id+'-mon').value, txt});
    save(); render(); announce('Added to the Assumptions and Occurrences log.'); }
  if (act==='delao'){ g.ao=g.ao.filter(a=>a.id!==+b.dataset.id); save(); render(); announce('Entry removed.'); }
  if (act==='lock'){ confirmOpen=true; setT('c-confirm',confirmBox()); const r=$('b-run'); if(r) r.focus(); }
  if (act==='cancelrun'){ confirmOpen=false; setT('c-confirm',''); $('b-lock').focus(); }
  if (act==='run'){ const r=g.r; lockMonth(); g.view='report'; confirmOpen=false; save(); render(true); announce(`Month ${r} is complete. Month-end report ready.`); window.scrollTo(0,0); }
  if (act==='undo'||act==='redo'){ ensureHist(); const from=act==='undo'?g.undo:g.redo, to=act==='undo'?g.redo:g.undo; const step=from.pop();
    if(step){ to.push({label:step.label, plan:JSON.stringify(g.plan)}); g.plan=JSON.parse(step.plan); save(); render(); announce(`${act==='undo'?'Undone':'Redone'}: ${step.label}.`); const nb=$(act==='undo'?'b-undo':'b-redo'); if(nb&&!nb.disabled) nb.focus(); else { const o=$(act==='undo'?'b-redo':'b-undo'); if(o) o.focus(); } } }
  if (act==='resetmonth'){ resetOpen=true; updateUndoBar(); const y=document.querySelector('[data-act=resetyes]'); if(y) y.focus(); }
  if (act==='resetno'){ resetOpen=false; updateUndoBar(); const r=$('b-reset'); if(r) r.focus(); }
  if (act==='resetyes'){ ensureHist(); pushUndo('Reset to start of month'); g.plan=JSON.parse(g.monthStart); resetOpen=false; save(); render(); announce('Plan reset to the start of the month. Select Undo to reverse.'); const u=$('b-undo'); if(u) u.focus(); }
  if (act==='print'){ try{ window.print(); }catch(x){} }
  if (act==='copyreport'){ const html=reportForPaste(), txt=$('report').innerText; const done=()=>setT('exp-msg',ok('Report copied. Paste it into your course’s text submission box.'));
    const fallback=()=>{ const s=window.getSelection(), rg=document.createRange(); rg.selectNodeContents($('report')); s.removeAllRanges(); s.addRange(rg); setT('exp-msg','Copy was blocked. The report is selected; press Ctrl+C or Cmd+C.'); };
    try{ if (window.ClipboardItem) navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]).then(done,()=>navigator.clipboard.writeText(txt).then(done,fallback));
      else navigator.clipboard.writeText(txt).then(done,fallback); }catch(x){ fallback(); } }
  if (act==='restart'){ setT('restart-confirm',`<div class="confirm"><p><strong>Start over?</strong> This clears your saved simulation in this browser. Save your report first.</p><div class="row"><button class="btn" type="button" data-act="restartyes">Clear and start over</button><button class="btn secondary" type="button" data-act="restartno">Cancel</button></div></div>`); }
  if (act==='restartno'){ setT('restart-confirm',''); }
  if (act==='restartyes'){ try{ localStorage.removeItem(KEY); }catch(x){} g=null; DATES=today(); render(true); }
  if (act==='savecode'){ const code=btoa(unescape(encodeURIComponent(JSON.stringify(g)))); const ta=$('savecode-out'); ta.value=code; ta.select(); try{ navigator.clipboard.writeText(code).then(()=>announce('Save code copied.'),()=>{}); }catch(x){} }
});
(function init(){ render(); })();
</script>
